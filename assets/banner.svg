<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Animated Signal Waves & Pulse Nodes (Background Graphics) -->
  <g opacity="0.25">
    <circle cx="1050" cy="175" r="140" fill="none" stroke="url(#accent-cyan)" stroke-width="2">
      <animate attributeName="r" values="120;180;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="175" r="90" fill="none" stroke="url(#accent-purple)" stroke-width="2">
      <animate attributeName="r" values="80;130;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="175" r="40" fill="url(#accent-cyan)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Network Topology Lines (Lower Right & Background Sides) -->
  <path d="M 750,280 L 850,220 L 950,260 L 1050,175 L 980,80 L 860,110 Z" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

  <g filter="url(#neon-glow)">
    <circle cx="750" cy="280" r="5" fill="#38bdf8"/>
    <circle cx="850" cy="220" r="6" fill="#a855f7"/>
    <circle cx="950" cy="260" r="4" fill="#ec4899"/>
    <circle cx="980" cy="80" r="5" fill="#38bdf8"/>
    <circle cx="860" cy="110" r="7" fill="#6366f1"/>
  </g>

  <!-- Foreground Content (Text and Badges) - Fully Clear & Unblocked -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="url(#accent-purple)" opacity="0.9"/>
    <text x="115" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">TELECOM CRM &amp; BSS/OSS</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Telecom CRM
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Curated Telecom CRMs, BSS/OSS Platforms &amp; Subscriber Lifecycle Systems
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="5" fill="#10b981"/>
      <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">SaaS &amp; Enterprise</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="200" cy="18" r="5" fill="#3b82f6"/>
      <text x="214" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Open-Source BSS</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="185" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="390" cy="18" r="5" fill="#a855f7"/>
      <text x="404" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Subscriber Engine</text>
    </g>
  </g>
</svg>
